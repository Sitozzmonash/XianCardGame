# Render 默认从仓库根目录读取此 Blueprint。
services:
  - type: web
    name: xiuxian-card-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: DEFAULT_ISMCTS_SIMULATIONS
        value: "500"
      - key: ISMCTS_MAX_SIMULATIONS
        value: "2000"
      - key: MODEL_DIR
        value: models
      - key: SESSION_TTL_SECONDS
        value: "3600"
      - key: MAX_SESSIONS
        value: "200"
      - key: MAX_DECISIONS
        value: "500"
