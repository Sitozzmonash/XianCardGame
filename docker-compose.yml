# 修仙卡牌 · 本地/自托管一键编排（Docker Compose）
#
# 用法：
#     docker compose up -d --build        # 构建并启动后端 :8000
#     docker compose ps                   # 看健康状态
#     docker compose logs -f api          # 跟日志
#     docker compose down                 # 停止
#
# 前端改为 Next.js：另开终端进入 frontend 后执行 npm run dev。
# 打开：http://localhost:3000 · http://localhost:8000/api/v1/health
#
# ⚠️ 两个必须知道的点：
# 1. Vercel 前端使用构建期变量 `NEXT_PUBLIC_API_BASE_URL` 指向 Render 后端。
# 2. 镜像自带 2/3 人轻量 MCCFR 推理模型；本地训练的更大模型仍可通过 bind mount 覆盖。

name: xiuxian-card

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: xiuxian-card-api:local
    container_name: xiuxian-card-api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      # 生产部署请改成 Vercel 前端实际域名
      CORS_ORIGINS: "*"
      DEFAULT_ISMCTS_SIMULATIONS: "500"
      ISMCTS_MAX_SIMULATIONS: "2000"
      MODEL_DIR: models
      SESSION_TTL_SECONDS: "3600"
      MAX_SESSIONS: "200"
      MAX_DECISIONS: "500"
    volumes:
      # 可选：用宿主目录覆盖镜像内的轻量模型，无需重建镜像
      - ./backend/models:/app/models:ro
    restart: unless-stopped
