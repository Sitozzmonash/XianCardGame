# Netlify 部署配置：前端是 Expo Web 静态导出（frontend/dist）
# 用法：Netlify → Add new site → Import an existing project → 选本仓库
# 注意：本账号默认对新站点开启 SSO 登录门禁，用 API 建站后需 PATCH /sites/{id} {"sso_login": false}

[build]
  base = "frontend"
  command = "npm ci && npx expo export --platform web --output-dir dist"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "22"
  EXPO_NO_TELEMETRY = "1"
  # 部署后改成 Render 后端地址，例如 https://xiuxian-card-api.onrender.com/api/v1
  EXPO_PUBLIC_API_BASE_URL = "http://localhost:8000/api/v1"

# 静态导出：expo-router 会为每个路由生成独立 HTML（index/setup/battle/cards/result/ai-lab/_sitemap/+not-found），
# 以及 `card/[cardId]` 由 `generateStaticParams()` 预生成的 8 个卡牌页（`card/TRIBULATION.html` …）。
# Netlify 的 Pretty URLs 会把 /cards 解析到 cards.html，**嵌套路由同理**（/card/STARGAZING → card/STARGAZING.html，
# 已存在的文件优先于下面的 catch-all），因此**不要**加 SPA catch-all 重写，否则 /cards 会被重写回首页。
# 未知路径回退到 Expo 生成的 404 页面。
# 部署后**必须实测**（clean URL 与嵌套路由两条都要验）：
#   curl -sI https://<site>/cards | head -1              # 期望 200
#   curl -sI https://<site>/card/TRIBULATION | head -1   # 期望 200（不是 404）
#   curl -sI https://<site>/nope | head -1               # 期望 404
[[redirects]]
  from = "/*"
  to = "/+not-found.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
