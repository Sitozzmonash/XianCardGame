# 前端站点托管配置（nginx）
#
# 关键点：`expo export --platform web` 产出的是**扁平 HTML**
#   index.html / setup.html / battle.html / cards.html / result.html / ai-lab.html
#   _sitemap.html / +not-found.html / card/<CARD_ID>.html（由 generateStaticParams 预生成 8 个）
# 而应用内部路由是无扩展名的（`/cards`、`/card/TRIBULATION`），必须做 clean-URL 映射，
# 否则直接访问或刷新深链会 404。行为与线上 Netlify（Pretty URLs）保持一致。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 文本资源压缩（Expo Web 的 JS 包单个就有几 MB，不压传输量太大）
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    # 带内容 hash 的静态资源可长缓存
    location /_expo/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 图片/字体等资产（文件名不带 hash，用较短缓存）
    location ~* \.(?:png|jpg|jpeg|webp|svg|ttf|otf|woff2?|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # clean URL：/cards → cards.html；嵌套路由 /card/TRIBULATION → card/TRIBULATION.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # 未知路径给出真实 404 状态 + 我们的兜底页（不要用 try_files 直接指向它，那会变成 200）
    error_page 404 /+not-found.html;
    location = /+not-found.html {
        internal;
    }
}
