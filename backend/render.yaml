# Render 部署配置：后端 FastAPI 服务
# 用法：Render Dashboard → New → Blueprint → 选择本仓库（rootDir 已在下方指定）
services:
  - type: web
    name: xiuxian-card-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: DEFAULT_ISMCTS_SIMULATIONS
        value: "500"
      - key: ISMCTS_MAX_SIMULATIONS
        value: "2000"
      - key: MODEL_DIR
        value: models
      - key: SESSION_TTL_SECONDS
        value: "3600"
      - key: MAX_SESSIONS
        value: "200"
      - key: MAX_DECISIONS
        value: "500"
